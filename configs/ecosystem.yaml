seed: 42
device: cpu

env:
  id: ecosystem
  max_steps: 1000          # ecosystem episodes are longer than simple_tag's 200
  # Phase-1 starting populations. Initial roster is the maximum (no reproduction yet).
  n_predators: 10
  n_prey: 10
  # Ecosystem-specific knobs (read by make_ecosystem_env).
  ecosystem:
    pred_max_hp: 100.0
    pred_max_energy: 100.0
    pred_speed: 0.05
    pred_sense_radius: 0.6
    prey_max_hp: 30.0
    prey_max_energy: 100.0
    prey_speed: 0.065
    prey_sense_radius: 0.6
    attack_damage: 15.0
    attack_range: 0.075
    eat_energy_gain: 20.0
    pred_energy_cost: 0.5
    prey_energy_cost: 0.0
    reward_per_hit: 10.0
    reward_per_death: -50.0
    survival_bonus: 0.05
    boundary_threshold: 0.9
    boundary_penalty: 5.0
    max_neighbors_obs: 4

train:
  algo: ppo
  total_episodes: 200
  gamma: 0.99
  gae_lambda: 0.95
  lr: 3.0e-4
  minibatch_size: 1024
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 128
  centralized_critic: false   # Phase 1: keep decentralised; MAPPO with dynamic pop is Phase 2

league:
  enabled: true
  snapshot_every: 25
  opponent_prob: 0.3
  max_snapshots: 20

logging:
  save_dir: artifacts/
  plot_every: 25

checkpoint:
  enabled: true
  every: 100

recording:
  enabled: true
  sample_rate: 1
